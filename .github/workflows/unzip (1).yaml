name: Extract Zip

# CLEAN REPLACE: deletes every file in the repository (except .git and .github),
# then extracts the uploaded zip into the root and deletes the zip.
# Runs automatically when a .zip is pushed to the repo root, or manually from
# the Actions tab (Run workflow).
#
# .github/ is never touched (GitHub refuses workflow changes made with the
# default token), and a .github folder inside the zip is ignored.
# The old files are only deleted AFTER the zip was found and extracted OK.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace all files with the zip contents
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob

          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in the repository root!"
            exit 1
          fi
          echo "Found: $ZIP_FILE"

          WORK=$(mktemp -d)
          mkdir "$WORK/new"
          unzip -o -q "$ZIP_FILE" -d "$WORK/new"
          rm -rf "$WORK/new/__MACOSX"

          # If the zip holds a single top-level folder, use its contents.
          entries=("$WORK/new"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
            echo "Zip has one top-level folder; using its contents."
          else
            SRC="$WORK/new"
          fi
          rm -rf "$SRC/.github"

          if [ -z "$(ls -A "$SRC")" ]; then
            echo "::error::The zip is empty - nothing was deleted."
            exit 1
          fi

          echo "Deleting old files (keeping .git and .github)..."
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          cp -a "$SRC"/. .
          echo "--- repository root after extraction:"
          ls -la

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace all files with the contents of the uploaded zip"
            git push
          fi
