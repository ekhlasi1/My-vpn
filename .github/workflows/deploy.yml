name: Deploy to Cloudflare

# Zero-touch deploy: on every push the workflow
#   1. builds the project (scripts/ci-setup.js creates the D1 database if it
#      does not exist, writes its id into wrangler.toml, applies the schema),
#   2. deploys the Worker,
#   3. calls /health, which makes the Worker create any missing tables right
#      away and proves that the database is really ready.
#
# One-time setup (the ONLY manual step): add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with  Workers Scripts: Edit  +  D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Without them this workflow skips itself (useful if you deploy through
# Cloudflare Workers Builds instead — do not use both at the same time).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'dot-server/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable automatic deploys."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci || npm install

      - name: Test
        if: steps.gate.outputs.enabled == 'true'
        run: npm test

      # Must run BEFORE `wrangler deploy`: wrangler reads wrangler.toml once at
      # startup, so the database_id has to be on disk already.
      - name: Build (creates D1 database + applies schema)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Verify /health (database ready)
        if: steps.gate.outputs.enabled == 'true'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          URL="${WORKER_URL:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)}"
          if [ -z "$URL" ]; then
            echo "::notice title=Health check skipped::No workers.dev URL found. Set a repository variable WORKER_URL (e.g. https://my-vpn.example.com) to enable it."
            exit 0
          fi
          URL="${URL%/}"
          for i in $(seq 1 12); do
            BODY="$(curl -fsS --max-time 20 "$URL/health" || true)"
            echo "attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "Database is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Health check failed::$URL/health did not report a ready database. Open it in a browser or run: npx wrangler tail"
          exit 1
