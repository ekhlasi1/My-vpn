name: Unzip and commit vipvpn-main-updated.zip
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Ensure unzip is installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip archive
        run: |
          set -e
          ZIP_PATH="vipvpn-main-updated.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "$ZIP_PATH not found in repository root"
            exit 1
          fi
          mkdir -p extracted_tmp
          unzip -o "$ZIP_PATH" -d extracted_tmp
          if [ -d extracted_tmp/vipvpn-main ]; then
            shopt -s dotglob || true
            mv extracted_tmp/vipvpn-main/* . || true
          else
            shopt -s dotglob || true
            mv extracted_tmp/* . || true
          fi
          rm -rf extracted_tmp

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unzip vipvpn-main-updated.zip"
            git push origin main
          fi
