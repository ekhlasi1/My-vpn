name: Extract Zip

# Extracts the uploaded zip into the repository root and deletes it.
# Runs automatically when a .zip is pushed to the repo root, or manually
# from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip (overwrite existing files) into root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in the repository root!"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE" -d .
          rm "$ZIP_FILE"
          echo "--- repository root after extraction:"
          ls -la

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract zip into root and overwrite existing files"
            git push
          fi
